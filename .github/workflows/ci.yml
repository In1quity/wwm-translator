name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install npm dependencies
        run: npm ci
      - name: Repo quality checks
        run: npm run check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  build-windows-exe:
    name: Build Windows exe
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build executable
        run: powershell -ExecutionPolicy Bypass -File packaging/build_exe.ps1
      - name: Zip artifact
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "WWMTranslator-$tag-win64.zip"
          Compress-Archive -Path "dist/WWMTranslator/*" -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ github.ref_name }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
